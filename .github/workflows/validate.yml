name: Security Dependency Checks

on:
  schedule:
    # Run at minute 20 and 50 past every hour to avoid top-of-the-hour runner queue delays
    - cron: '20,50 * * * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: crawl-job
      cancel-in-progress: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install || npm install --package-lock-only && npm ci

      - name: Restore Cache
        run: |
          curl -sL -f "https://raw.githubusercontent.com/${{ github.repository }}/live-data/pulse_data.json" -o pulse_data.json || true

      - name: Run Validation
        run: npm start

      - name: Stage Artifacts
        run: |
          mkdir -p /tmp/deploy_live /tmp/deploy_prod
          cp pulse_data.json pulse_data.json.br /tmp/deploy_live/
          cp tv_feed_latest.json tv_feed_latest.json.br shelves_index.json shelves_index.json.br /tmp/deploy_prod/
          cp topics.json /tmp/deploy_prod/topics_latest.json
          cp -r shelves /tmp/deploy_prod/
          echo "*" > /tmp/deploy_prod/CORS

      - name: Update Live Data Branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan live-data
          git rm -rf .
          git clean -fdx
          cp -r /tmp/deploy_live/* .
          git add -A
          git commit -m "Auto-update telemetry datasets [skip ci]" || echo "No changes to commit"
          git push origin live-data -f || echo "No changes to push"

      - name: Update Distribution Branch
        run: |
          git checkout --orphan prod
          git rm -rf .
          git clean -fdx
          cp -r /tmp/deploy_prod/* .
          git add -A
          git commit -m "Auto-update distribution datasets [skip ci]" || echo "No changes to commit"
          git push origin prod -f || echo "No changes to push"
