name: Telemetry Pipeline Automation

on:
  schedule:
    # Run at minute 20 and 50 past every hour
    - cron: '20,50 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: telemetry-pipeline-sync
      cancel-in-progress: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'crawler/package-lock.json'

      - name: Install Dependencies
        working-directory: ./crawler
        run: npm install || npm install --package-lock-only && npm ci

      - name: Restore Analytics Cache
        working-directory: ./crawler
        run: |
          curl -sL -f "https://raw.githubusercontent.com/${{ github.repository }}/live-data/pulse_data.json" -o pulse_data.json || true

      - name: Process Datasets
        working-directory: ./crawler
        run: node index.js

      - name: Deploy Live Data Branch (Telemetry)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan live-data
          git rm -rf .
          cp crawler/pulse_data.json .
          cp crawler/pulse_data.json.br . || true
          git add pulse_data.json pulse_data.json.br
          git commit -m "Auto-update telemetry datasets [skip ci]" || echo "No changes to commit"
          git push origin live-data -f || echo "No changes to push"

      - name: Deploy Prod Branch (Distribution Slice)
        run: |
          git checkout --orphan prod
          git rm -rf .
          cp crawler/tv_feed_latest.json .
          cp crawler/tv_feed_latest.json.br . || true
          cp crawler/shelves_index.json .
          cp crawler/shelves_index.json.br . || true
          cp crawler/topics.json ./topics_latest.json
          mkdir -p shelves
          cp -r crawler/shelves/* shelves/
          echo "*" > CORS
          git add tv_feed_latest.json tv_feed_latest.json.br shelves_index.json shelves_index.json.br topics_latest.json shelves CORS
          git commit -m "Auto-update distribution datasets [skip ci]" || echo "No changes to commit"
          git push origin prod -f || echo "No changes to push"
